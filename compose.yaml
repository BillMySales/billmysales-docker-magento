# Mage-OS stack (Magento Open Source distribution): Caddy + Mage-OS (PHP-FPM,
# own image, compiled for production) + MariaDB + OpenSearch, with setup and
# cron, and optional backups and Mailpit.
#
# Quick start (development):
#   cp .env.dev.example .env
#   docker compose up -d
#   docker compose logs -f setup   # wait for "==> Done"
#
# Production: start from .env.prod.example instead. See README.md.
#
# Required variables have no default: compose refuses to start without them.

name: ${COMPOSE_PROJECT_NAME:-magento}

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

# Mage-OS image, built from image/Dockerfile (php:<ver>-fpm-alpine + Mage-OS
# installed with Composer, DI compiled and static content deployed).
x-mage-image: &mage-image
  image: ${MAGEOS_IMAGE:-mageos-fpm}:${MAGEOS_VERSION:-3.5.0}-php${PHP_VERSION:-8.5}
  build:
    context: ./image
    args:
      PHP_VERSION: ${PHP_VERSION:-8.5}
      MAGEOS_VERSION: ${MAGEOS_VERSION:-3.5.0}
      MAGEOS_DISABLE_MODULES: ${MAGEOS_DISABLE_MODULES:-}
      MAGEOS_LOCALES: ${MAGEOS_LOCALES:-en_US}
      MAGEOS_THEMES: ${MAGEOS_THEMES:-Magento/luma Magento/backend MageOS/m137-admin-theme}

# Environment shared by PHP-FPM, setup and cron.
x-mage-env: &mage-env
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-756M}
  PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
  PHP_TIMEZONE: ${PHP_TIMEZONE:-America/Santiago}
  PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-Off}
  UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-64M}
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
  # CLI commands (setup, cron, console). Compilation happens at image build
  # time, so the 2G Magento recommends for compiling isn't needed here.
  PHP_CLI_MEMORY_LIMIT: ${PHP_CLI_MEMORY_LIMIT:-1536M}

# Files mounted in PHP-FPM, setup and cron.
x-mage-volumes: &mage-volumes
  - code:/var/www/magento
  - media:/var/www/magento/pub/media
  - ./config/php/php.ini:/usr/local/etc/php/conf.d/zz-stack.ini:ro
  - ./scripts:/usr/local/share/stack/scripts:ro

services:
  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_NAME:-magento}
      MARIADB_USER: ${DB_USER:-magento}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}

  # Search engine (required by Mage-OS / Magento 2.4.9). Single node, internal
  # network only, security plugin off (not published, no credentials needed).
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.8.0}
    restart: unless-stopped
    logging: *logging
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_MEMORY_LIMIT:-1536m}

  # One-shot job: syncs the compiled code, installs or upgrades Mage-OS and
  # applies the environment. Safe to repeat; runs on every `up`. Starts as
  # root to fix ownership, runs PHP as www-data (82).
  setup:
    <<: *mage-image
    user: root
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      <<: *mage-env
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-magento}
      DB_USER: ${DB_USER:-magento}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      MAGE_URL: ${MAGE_URL:?Set MAGE_URL in .env (e.g. https://shop.example.com)}
      MAGE_ADMIN_PATH: ${MAGE_ADMIN_PATH:?Set MAGE_ADMIN_PATH in .env (admin URL path)}
      MAGE_ADMIN_USER: ${MAGE_ADMIN_USER:-admin}
      MAGE_ADMIN_PASSWORD: ${MAGE_ADMIN_PASSWORD:?Set MAGE_ADMIN_PASSWORD in .env}
      MAGE_ADMIN_EMAIL: ${MAGE_ADMIN_EMAIL:?Set MAGE_ADMIN_EMAIL in .env}
      MAGE_STORE_NAME: ${MAGE_STORE_NAME:-Mage-OS}
      MAGE_LOCALE: ${MAGE_LOCALE:-en_US}
      MAGE_CURRENCY: ${MAGE_CURRENCY:-CLP}
      MAGE_COUNTRY: ${MAGE_COUNTRY:-CL}
      # production (compiled in the image) or developer (module development).
      MAGE_MODE: ${MAGE_MODE:-production}
      MAGE_ENABLE_MODULES: ${MAGE_ENABLE_MODULES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-tls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes: *mage-volumes
    entrypoint: ["sh", "/usr/local/share/stack/scripts/setup.sh"]
    restart: "no"
    # A limit keeps an install/upgrade that runs out of memory inside this
    # container, instead of the kernel killing another process (OpenSearch).
    deploy:
      resources:
        limits:
          memory: ${SETUP_MEMORY_LIMIT:-2g}

  # PHP-FPM with Mage-OS. Not published; Caddy talks to it on port 9000.
  magento:
    <<: *mage-image
    restart: unless-stopped
    logging: *logging
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *mage-env
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-10}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-2}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-4}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
    # Lets Mage-OS reach services on the host (e.g. an app running locally)
    # at http://host.docker.internal:<port>, also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - code:/var/www/magento
      - media:/var/www/magento/pub/media
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/zz-stack.ini:ro
      - ./config/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-stack.conf:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MAGE_MEMORY_LIMIT:-1536m}

  # Runs Magento's cron (indexers, emails, queue consumers...) every CRON_INTERVAL seconds.
  cron:
    <<: *mage-image
    user: www-data
    restart: unless-stopped
    logging: *logging
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *mage-env
      CRON_INTERVAL: ${CRON_INTERVAL:-60}
    volumes: *mage-volumes
    entrypoint: ["sh", "/usr/local/share/stack/scripts/cron.sh"]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/share/stack/scripts/cron.sh", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${CRON_MEMORY_LIMIT:-1g}

  caddy:
    image: caddy:${CADDY_VERSION:-2.11}-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      magento:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-64M}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Read-only: Caddy serves static files and media and forwards PHP to FPM.
      - code:/var/www/magento:ro
      - media:/var/www/magento/pub/media:ro
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates and keys (keep them: ACME rate limits).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Internal :8080 site: the home page answers (2xx, or a redirect to the
      # base URL). Magento 2.4.9's health_check.php reports the installer's own
      # cache config as invalid, so it can't be used.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-256m}

  # Optional (profile "backup"): DB dump + media and env.php every
  # BACKUP_INTERVAL_HOURS, kept BACKUP_KEEP_DAYS days in the `backups` volume
  # (overrides/local-dirs.yaml puts them in a local directory instead).
  backup:
    image: mariadb:${MARIADB_VERSION:-12.3}
    profiles: ["backup"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-magento}
      DB_USER: ${DB_USER:-magento}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      # Read-write so `backup.sh restore` can put the files back.
      - code:/var/www/magento
      - media:/var/www/magento/pub/media
      - backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["bash", "/usr/local/bin/backup.sh"]
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/backup.sh", "health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT:-512m}

  # Optional (profile "mailpit", development): catches all outgoing mail.
  # Set SMTP_HOST=mailpit and SMTP_PORT=1025; web UI on MAILPIT_PORT.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.31}
    profiles: ["mailpit"]
    restart: unless-stopped
    logging: *logging
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"

  # Magento's CLI (profile "tools"), as www-data, e.g.:
  #   docker compose run --rm console indexer:status
  console:
    <<: *mage-image
    profiles: ["tools"]
    user: www-data
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *mage-env
    volumes: *mage-volumes
    entrypoint: ["sh", "-c", "exec php -d memory_limit=\"$${PHP_CLI_MEMORY_LIMIT}\" bin/magento \"$$@\"", "--"]
    command: ["list"]
    deploy:
      resources:
        limits:
          memory: ${SETUP_MEMORY_LIMIT:-2g}

volumes:
  db_data:
  opensearch_data:
  code:
  media:
  caddy_data:
  caddy_config:
  backups:
