; OPcache settings for Mage-OS / Magento. In production mode files only change
; with a new image, so timestamps aren't checked; developer mode (live-edited
; modules) sets PHP_OPCACHE_VALIDATE_TIMESTAMPS=1.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=130000
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.save_comments=1
